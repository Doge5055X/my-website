
<style>
  #arena { display:block; border-radius:var(--border-radius-lg); border:0.5px solid var(--color-border-tertiary); background:#0f0f1a; cursor:default; }
  .hud { display:flex; gap:12px; margin-top:10px; align-items:center; flex-wrap:wrap; }
  .score-card { background:var(--color-background-secondary); border-radius:var(--border-radius-md); padding:8px 16px; text-align:center; min-width:80px; }
  .score-card .lbl { font-size:11px; color:var(--color-text-secondary); }
  .score-card .num { font-size:22px; font-weight:500; }
  .r-num { color:#e05050; }
  .p-num { color:#4a9eff; }
  .s-num { color:#f0c040; }
  .controls { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:8px; }
  .controls label { font-size:13px; color:var(--color-text-secondary); }
  .controls .row { display:flex; align-items:center; gap:6px; }
  .controls span { font-size:13px; font-weight:500; min-width:24px; }
  #winBanner { display:none; font-size:15px; font-weight:500; padding:6px 16px; border-radius:var(--border-radius-md); background:var(--color-background-secondary); color:var(--color-text-primary); }
</style>

<canvas id="arena"></canvas>
<div class="hud">
  <div class="score-card"><div class="lbl">Rock</div><div class="num r-num" id="rCount">0</div></div>
  <div class="score-card"><div class="lbl">Paper</div><div class="num p-num" id="pCount">0</div></div>
  <div class="score-card"><div class="lbl">Scissors</div><div class="num s-num" id="sCount">0</div></div>
  <div style="flex:1"></div>
  <div id="winBanner"></div>
  <button id="restartBtn">Restart</button>
</div>
<div class="controls">
  <div class="row"><label>Count</label><input type="range" id="countSlider" min="5" max="40" value="15" step="1"><span id="countVal">15</span></div>
  <div class="row"><label>Speed</label><input type="range" id="speedSlider" min="1" max="6" value="3" step="1"><span id="speedVal">3</span></div>
</div>

<script>
const canvas = document.getElementById('arena');
const ctx = canvas.getContext('2d');
canvas.width = 660;
canvas.height = 420;

const W = canvas.width, H = canvas.height;
const TYPES = ['rock','paper','scissors'];
const EMOJIS = { rock:'🪨', paper:'📄', scissors:'✂️' };
const COLORS = { rock:'#e05050', paper:'#4a9eff', scissors:'#f0c040' };
const BEATS = { rock:'scissors', scissors:'paper', paper:'rock' };

let entities = [], speed = 3, perType = 15, running = true;

function rand(min, max) { return min + Math.random() * (max - min); }

function spawn() {
  entities = [];
  running = true;
  document.getElementById('winBanner').style.display = 'none';
  TYPES.forEach(type => {
    for (let i = 0; i < perType; i++) {
      entities.push({
        type,
        x: rand(20, W - 20),
        y: rand(20, H - 20),
        vx: rand(-1, 1) * speed,
        vy: rand(-1, 1) * speed,
        size: 18,
        wobble: Math.random() * Math.PI * 2,
        convertTimer: 0
      });
    }
  });
}

function nearest(e) {
  let prey = null, threat = null, dPrey = Infinity, dThreat = Infinity;
  const myPrey = BEATS[e.type];
  const myThreat = BEATS[BEATS[e.type]];
  for (const o of entities) {
    if (o === e) continue;
    const dx = o.x - e.x, dy = o.y - e.y;
    const d = Math.sqrt(dx*dx + dy*dy);
    if (o.type === myPrey && d < dPrey) { dPrey = d; prey = o; }
    if (o.type === myThreat && d < dThreat) { dThreat = d; threat = o; }
  }
  return { prey, threat, dPrey, dThreat };
}

function update() {
  const s = speed * 0.6;

  for (const e of entities) {
    e.wobble += 0.08;

    const { prey, threat, dPrey, dThreat } = nearest(e);

    let ax = 0, ay = 0;

    if (prey && dPrey < 160) {
      const dx = prey.x - e.x, dy = prey.y - e.y;
      const d = Math.sqrt(dx*dx + dy*dy) || 1;
      ax += (dx / d) * 0.25;
      ay += (dy / d) * 0.25;
    }
    if (threat && dThreat < 130) {
      const dx = e.x - threat.x, dy = e.y - threat.y;
      const d = Math.sqrt(dx*dx + dy*dy) || 1;
      ax += (dx / d) * 0.4;
      ay += (dy / d) * 0.4;
    }

    e.vx += ax;
    e.vy += ay;

    const spd = Math.sqrt(e.vx*e.vx + e.vy*e.vy);
    if (spd > s * 1.5) { e.vx = e.vx / spd * s * 1.5; e.vy = e.vy / spd * s * 1.5; }
    if (spd < 0.3) { e.vx += rand(-0.3, 0.3); e.vy += rand(-0.3, 0.3); }

    e.x += e.vx;
    e.y += e.vy;

    if (e.x < 18) { e.x = 18; e.vx = Math.abs(e.vx); }
    if (e.x > W-18) { e.x = W-18; e.vx = -Math.abs(e.vx); }
    if (e.y < 18) { e.y = 18; e.vy = Math.abs(e.vy); }
    if (e.y > H-18) { e.y = H-18; e.vy = -Math.abs(e.vy); }
  }

  for (let i = 0; i < entities.length; i++) {
    for (let j = i+1; j < entities.length; j++) {
      const a = entities[i], b = entities[j];
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.sqrt(dx*dx + dy*dy);
      const minD = a.size + b.size - 6;
      if (d < minD && d > 0) {
        if (BEATS[a.type] === b.type) {
          b.type = a.type; b.convertTimer = 8;
        } else if (BEATS[b.type] === a.type) {
          a.type = b.type; a.convertTimer = 8;
        } else {
          const nx = dx/d, ny = dy/d;
          const push = (minD - d) * 0.5;
          a.x -= nx*push; a.y -= ny*push;
          b.x += nx*push; b.y += ny*push;
        }
      }
    }
  }

  const counts = { rock:0, paper:0, scissors:0 };
  for (const e of entities) counts[e.type]++;
  document.getElementById('rCount').textContent = counts.rock;
  document.getElementById('pCount').textContent = counts.paper;
  document.getElementById('sCount').textContent = counts.scissors;

  const alive = TYPES.filter(t => counts[t] > 0);
  if (alive.length === 1) {
    running = false;
    const banner = document.getElementById('winBanner');
    banner.textContent = `${EMOJIS[alive[0]]} ${alive[0].charAt(0).toUpperCase()+alive[0].slice(1)} wins!`;
    banner.style.display = 'block';
  }
}

function drawEntity(e) {
  ctx.save();
  ctx.translate(e.x, e.y);

  const pulse = e.convertTimer > 0 ? 1 + e.convertTimer * 0.08 : 1;
  e.convertTimer = Math.max(0, e.convertTimer - 1);
  ctx.scale(pulse, pulse);

  ctx.font = `${e.size * 1.4}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  const glow = COLORS[e.type];
  ctx.shadowColor = glow;
  ctx.shadowBlur = 12;
  ctx.fillText(EMOJIS[e.type], 0, 0);
  ctx.shadowBlur = 0;

  ctx.restore();
}

function drawBg() {
  ctx.fillStyle = '#0f0f1a';
  ctx.fillRect(0, 0, W, H);

  ctx.strokeStyle = 'rgba(255,255,255,0.03)';
  ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 40) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  for (let y = 0; y < H; y += 40) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
}

function loop() {
  drawBg();
  if (running) update();
  for (const e of entities) drawEntity(e);
  requestAnimationFrame(loop);
}

document.getElementById('restartBtn').addEventListener('click', () => spawn());

document.getElementById('countSlider').addEventListener('input', function() {
  document.getElementById('countVal').textContent = this.value;
  perType = +this.value;
});
document.getElementById('speedSlider').addEventListener('input', function() {
  document.getElementById('speedVal').textContent = this.value;
  speed = +this.value;
});

spawn();
loop();
</script>
