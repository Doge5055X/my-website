<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>KUSHAL · hold to contract</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f8f8f8;
      touch-action: none;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background: #f8f8f8;
      cursor: pointer;
      touch-action: none;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    "use strict";

    /* ------------------------------------------------------------
       CANVAS
    ------------------------------------------------------------ */
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    let W = 0, H = 0, DPR = 1;

    function resize() {
      const rect = canvas.getBoundingClientRect();
      W = rect.width;
      H = rect.height;
      DPR = Math.min(window.devicePixelRatio || 1, 2);
      canvas.width = W * DPR;
      canvas.height = H * DPR;
      canvas.style.width = W + 'px';
      canvas.style.height = H + 'px';
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    }
    window.addEventListener('resize', resize);
    resize();

    /* ------------------------------------------------------------
       DESIGN SPACE
    ------------------------------------------------------------ */
    const DW = 1000, DH = 390;
    const X = x => x * W / DW;
    const Y = y => y * H / DH;

    const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
    const lerp = (a, b, t) => a + (b - a) * t;
    const easeInOutCubic = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    const easeOutBack = t => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    };
    const easeInOutSine = t => -(Math.cos(Math.PI * t) - 1) / 2;
    const easeOutCubic = t => 1 - Math.pow(1 - t, 3);

    class Point {
      constructor(x, y) { this.x = x; this.y = y; }
    }

    /* ------------------------------------------------------------
       MORPH STROKE
    ------------------------------------------------------------ */
    class MorphStroke {
      constructor(points, options = {}) {
        this.points = points;
        this.phase = options.phase || 0;
        this.seedX = options.seedX ?? 500;
        this.seedY = options.seedY ?? 195;
        this.seedSpread = options.seedSpread ?? 0;
        this.seedLength = options.seedLength ?? 90;
        this.index = options.index || 0;
      }
      collapsedPoint(i) {
        const p = this.points[i];
        const normalized = this.points.length <= 1 ? .5 : i / (this.points.length - 1);
        const vertical = (normalized - .5) * this.seedLength;
        const lateral = Math.sin(normalized * Math.PI * 2 + this.phase) * this.seedSpread;
        return new Point(this.seedX + lateral, this.seedY + vertical);
      }
      getPoint(i, progress, mode) {
        const final = this.points[i];
        const collapsed = this.collapsedPoint(i);
        if (mode === 'collapse') {
          return {
            x: lerp(final.x, collapsed.x, progress),
            y: lerp(final.y, collapsed.y, progress)
          };
        }
        if (mode === 'expand') {
          const overshoot = easeOutBack(progress);
          const dx = final.x - collapsed.x;
          const dy = final.y - collapsed.y;
          const perpX = -dy, perpY = dx;
          const mag = Math.hypot(perpX, perpY) || 1;
          const curve = Math.sin(progress * Math.PI) * 7;
          return {
            x: collapsed.x + dx * overshoot + (perpX / mag) * curve,
            y: collapsed.y + dy * overshoot + (perpY / mag) * curve
          };
        }
        return final;
      }
      drawCollapse(progress) {
        ctx.beginPath();
        for (let i = 0; i < this.points.length; i++) {
          const p = this.getPoint(i, progress, 'collapse');
          i === 0 ? ctx.moveTo(X(p.x), Y(p.y)) : ctx.lineTo(X(p.x), Y(p.y));
        }
        ctx.stroke();
      }
      drawExpand(progress) {
        ctx.beginPath();
        for (let i = 0; i < this.points.length; i++) {
          const p = this.getPoint(i, progress, 'expand');
          i === 0 ? ctx.moveTo(X(p.x), Y(p.y)) : ctx.lineTo(X(p.x), Y(p.y));
        }
        ctx.stroke();
      }
    }

    /* ------------------------------------------------------------
       KUSHAL GEOMETRY
    ------------------------------------------------------------ */
    const strokes = [];
    // K
    strokes.push(new MorphStroke([new Point(115,255), new Point(115,125)], { index: 0, phase: .1, seedLength: 130, seedSpread: 2 }));
    strokes.push(new MorphStroke([new Point(115,190), new Point(180,125)], { index: 1, phase: 1, seedLength: 100, seedSpread: 3 }));
    strokes.push(new MorphStroke([new Point(115,190), new Point(180,255)], { index: 2, phase: 2, seedLength: 100, seedSpread: 3 }));
    // U
    strokes.push(new MorphStroke([
      new Point(220,125), new Point(220,225), new Point(226,240),
      new Point(240,250), new Point(260,254), new Point(280,250),
      new Point(294,240), new Point(300,225), new Point(300,125)
    ], { index: 3, phase: .3, seedLength: 140, seedSpread: 4 }));
    // S
    strokes.push(new MorphStroke([
      new Point(390,130), new Point(370,124), new Point(330,124),
      new Point(315,138), new Point(315,168), new Point(330,180),
      new Point(370,180), new Point(385,192), new Point(385,228),
      new Point(370,248), new Point(330,248), new Point(315,244)
    ], { index: 4, phase: 1.5, seedLength: 150, seedSpread: 5 }));
    // H
    strokes.push(new MorphStroke([new Point(430,125), new Point(430,255)], { index: 5, phase: 2, seedLength: 130 }));
    strokes.push(new MorphStroke([new Point(500,125), new Point(500,255)], { index: 6, phase: 2.4, seedLength: 130 }));
    strokes.push(new MorphStroke([new Point(430,188), new Point(500,188)], { index: 7, phase: 3, seedLength: 80 }));
    // A
    strokes.push(new MorphStroke([new Point(540,255), new Point(580,125), new Point(620,255)], { index: 8, phase: .8, seedLength: 150, seedSpread: 4 }));
    strokes.push(new MorphStroke([new Point(560,190), new Point(600,190)], { index: 9, phase: 1.8, seedLength: 60 }));
    // L
    strokes.push(new MorphStroke([new Point(670,125), new Point(670,255), new Point(735,255)], { index: 10, phase: 2.5, seedLength: 150, seedSpread: 4 }));

    /* ------------------------------------------------------------
       PARTICLES
    ------------------------------------------------------------ */
    class Particle {
      constructor(x, y, energy = 1) {
        this.x = x;
        this.y = y;
        const angle = Math.random() * Math.PI * 2;
        const velocity = (.25 + Math.random() * .9) * energy;
        this.vx = Math.cos(angle) * velocity;
        this.vy = Math.sin(angle) * velocity;
        this.life = 300 + Math.random() * 900;
        this.maxLife = this.life;
        this.size = .35 + Math.random() * 1.4;
      }
      update(dt) {
        this.x += this.vx * dt * .055;
        this.y += this.vy * dt * .055;
        this.vx *= .985;
        this.vy *= .985;
        this.life -= dt;
      }
      draw() {
        const alpha = clamp(this.life / this.maxLife) * .25;
        ctx.beginPath();
        ctx.arc(X(this.x), Y(this.y), X(this.size), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(0,0,0,${alpha})`;
        ctx.fill();
      }
    }
    let particles = [];

    /* ------------------------------------------------------------
       SPINE
    ------------------------------------------------------------ */
    function drawSpine(progress, mode) {
      let alpha = 0;
      if (mode === 'collapse') alpha = easeInOutSine(progress);
      if (mode === 'expand') alpha = 1 - easeOutCubic(progress);
      if (alpha <= 0) return;
      ctx.save();
      ctx.lineCap = 'round';
      ctx.shadowColor = `rgba(0,0,0,${alpha * .22})`;
      ctx.shadowBlur = X(12);
      ctx.strokeStyle = `rgba(15,15,15,${alpha * .12})`;
      ctx.lineWidth = X(13);
      ctx.beginPath();
      ctx.moveTo(X(500), Y(125));
      ctx.lineTo(X(500), Y(265));
      ctx.stroke();
      ctx.shadowBlur = 0;
      ctx.strokeStyle = `rgba(12,12,12,${alpha * .8})`;
      ctx.lineWidth = X(3.2);
      ctx.beginPath();
      ctx.moveTo(X(500), Y(125));
      ctx.lineTo(X(500), Y(265));
      ctx.stroke();
      ctx.restore();
    }

    function emitCollapseParticles(progress) {
      if (Math.random() > .22) return;
      const stroke = strokes[Math.floor(Math.random() * strokes.length)];
      const pt = stroke.points[Math.floor(Math.random() * stroke.points.length)];
      particles.push(new Particle(pt.x, pt.y, .35));
    }

    function emitExpansionParticles(progress) {
      if (Math.random() > .30) return;
      const angle = Math.random() * Math.PI * 2;
      const radius = 15 + Math.random() * 30;
      particles.push(new Particle(500 + Math.cos(angle) * radius, 195 + Math.sin(angle) * radius, 1.7));
    }

    /* ------------------------------------------------------------
       DRAWING
    ------------------------------------------------------------ */
    function drawInitialWord() {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = X(5.6);
      ctx.strokeStyle = '#111';
      for (const stroke of strokes) {
        ctx.beginPath();
        for (let i = 0; i < stroke.points.length; i++) {
          const p = stroke.points[i];
          i === 0 ? ctx.moveTo(X(p.x), Y(p.y)) : ctx.lineTo(X(p.x), Y(p.y));
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawCollapse(progress) {
      const eased = easeInOutCubic(progress);
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = X(5.6);
      ctx.strokeStyle = '#111';
      for (const stroke of strokes) {
        const local = clamp((eased - stroke.index * .008) / .94);
        stroke.drawCollapse(easeInOutCubic(local));
      }
      ctx.restore();
      drawSpine(progress, 'collapse');
      emitCollapseParticles(progress);
    }

    function drawExpansion(progress) {
      ctx.save();
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = X(5.6);
      ctx.strokeStyle = '#111';
      for (const stroke of strokes) {
        const stagger = stroke.index * .018;
        const local = clamp((progress - stagger) / .82);
        stroke.drawExpand(easeOutBack(local));
      }
      ctx.restore();
      drawSpine(progress, 'expand');
      emitExpansionParticles(progress);
    }

    function drawFinal(time) {
      const breathing = 0.018 + Math.sin(time * .002) * .008;
      ctx.save();
      ctx.shadowColor = `rgba(0,0,0,${breathing})`;
      ctx.shadowBlur = X(8);
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';
      ctx.lineWidth = X(5.6);
      ctx.strokeStyle = '#111';
      for (const stroke of strokes) {
        ctx.beginPath();
        for (let i = 0; i < stroke.points.length; i++) {
          const p = stroke.points[i];
          i === 0 ? ctx.moveTo(X(p.x), Y(p.y)) : ctx.lineTo(X(p.x), Y(p.y));
        }
        ctx.stroke();
      }
      ctx.restore();
    }

    /* ------------------------------------------------------------
       ANIMATION STATE
    ------------------------------------------------------------ */
    const COLLAPSE_DURATION = 1400;   // ms to fully collapse
    const EXPAND_DURATION   = 1100;   // ms to fully expand
    const HOLD_STEADY       = 200;    // ms to linger at spine before expanding

    let isPressed = false;
    let pressStartTime = 0;
    let releaseStartTime = 0;
    let phase = 'idle'; // 'idle' | 'collapsing' | 'collapsed' | 'expanding' | 'settled'
    let animId = null;
    let lastFrameTime = 0;

    /* ------------------------------------------------------------
       RENDER LOOP
    ------------------------------------------------------------ */
    function render(now) {
      const dt = Math.min(now - lastFrameTime, 32);
      lastFrameTime = now;

      // clear
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#f8f8f8';
      ctx.fillRect(0, 0, W, H);

      // ---- IDLE ----
      if (phase === 'idle') {
        drawInitialWord();
        // small random sparkle
        if (Math.random() < 0.01) {
          particles.push(new Particle(300 + Math.random() * 400, 150 + Math.random() * 100, 0.15));
        }
      }

      // ---- COLLAPSING ----
      else if (phase === 'collapsing') {
        const elapsed = now - pressStartTime;
        const progress = clamp(elapsed / COLLAPSE_DURATION);
        drawCollapse(progress);
        if (progress >= 1) {
          phase = 'collapsed';
          pressStartTime = now; // reset for hold timer
        }
      }

      // ---- COLLAPSED (hold steady) ----
      else if (phase === 'collapsed') {
        // spine fully visible, with slight shimmer
        drawSpine(1, 'collapse');
        // tiny particles
        if (Math.random() < 0.02) {
          particles.push(new Particle(500 + (Math.random() - 0.5) * 30, 190 + Math.random() * 20, 0.1));
        }
        // if user releases, start expanding
        if (!isPressed) {
          phase = 'expanding';
          releaseStartTime = now;
        }
      }

      // ---- EXPANDING ----
      else if (phase === 'expanding') {
        const elapsed = now - releaseStartTime;
        const progress = clamp(elapsed / EXPAND_DURATION);
        drawExpansion(progress);
        if (progress >= 1) {
          phase = 'settled';
        }
      }

      // ---- SETTLED (fully expanded) ----
      else if (phase === 'settled') {
        drawFinal(now);
        if (Math.random() < 0.015) {
          particles.push(new Particle(500 + (Math.random() - 0.5) * 300, 195 + (Math.random() - 0.5) * 80, 0.1));
        }
        // if user presses again, go back to collapsing
        if (isPressed) {
          phase = 'collapsing';
          pressStartTime = now;
        }
      }

      // ---- PARTICLES (always) ----
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.update(dt);
        p.draw();
        if (p.life <= 0) particles.splice(i, 1);
      }

      animId = requestAnimationFrame(render);
    }

    /* ------------------------------------------------------------
       START / STOP ANIMATION LOOP
    ------------------------------------------------------------ */
    function startLoop() {
      if (animId) return;
      lastFrameTime = performance.now();
      animId = requestAnimationFrame(render);
    }

    function stopLoop() {
      if (animId) {
        cancelAnimationFrame(animId);
        animId = null;
      }
    }

    /* ------------------------------------------------------------
       POINTER EVENTS (touch + mouse)
    ------------------------------------------------------------ */
    function handlePointerDown(e) {
      e.preventDefault();
      if (isPressed) return;
      isPressed = true;
      pressStartTime = performance.now();

      // if settled or idle, start collapsing
      if (phase === 'idle' || phase === 'settled') {
        phase = 'collapsing';
        pressStartTime = performance.now();
        startLoop();
      }
      // if expanding mid-way, cancel expansion and collapse from current state?
      else if (phase === 'expanding') {
        // snap to collapsing from current position – we just reset
        phase = 'collapsing';
        pressStartTime = performance.now();
      }
      // if already collapsed, do nothing (hold)
    }

    function handlePointerUp(e) {
      e.preventDefault();
      if (!isPressed) return;
      isPressed = false;

      // if collapsing or collapsed, start expanding
      if (phase === 'collapsing' || phase === 'collapsed') {
        phase = 'expanding';
        releaseStartTime = performance.now();
        startLoop();
      }
      // if idle or settled, nothing
    }

    function handlePointerCancel(e) {
      e.preventDefault();
      // treat as pointer up
      if (isPressed) {
        isPressed = false;
        if (phase === 'collapsing' || phase === 'collapsed') {
          phase = 'expanding';
          releaseStartTime = performance.now();
          startLoop();
        }
      }
    }

    // --- attach events ---
    canvas.addEventListener('pointerdown', handlePointerDown);
    canvas.addEventListener('pointerup', handlePointerUp);
    canvas.addEventListener('pointercancel', handlePointerCancel);
    canvas.addEventListener('pointerleave', (e) => {
      // if pointer leaves canvas while pressed, treat as release
      if (isPressed) {
        handlePointerUp(e);
      }
    });

    // prevent context menu and scrolling
    canvas.addEventListener('contextmenu', e => e.preventDefault());

    /* ------------------------------------------------------------
       INITIAL START — show the word immediately
    ------------------------------------------------------------ */
    phase = 'idle';
    startLoop();
  </script>
</body>
</html>
