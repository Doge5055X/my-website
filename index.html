<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Arcade Basketball</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            width: 100%;
            max-width: 450px;
            height: 100vh;
            max-height: 700px;
            background-color: #0f172a;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// Fixed logical dimensions
const WIDTH = 450;
const HEIGHT = 700;

function resizeCanvas() {
    canvas.width = WIDTH;
    canvas.height = HEIGHT;
}
resizeCanvas();

// Game Variables
let score = 0;
let highScore = 0;
const GRAVITY = 0.45;
const BOUNCE_DAMPING = 0.65;

// Hoop Setup
const hoop = {
    x: WIDTH / 2,
    y: 180,
    width: 70,
    rimRadius: 5,
    get leftRim() { return this.x - this.width / 2; },
    get rightRim() { return this.x + this.width / 2; }
};

// Ball Setup
const ball = {
    spawnX: WIDTH / 2,
    spawnY: 580,
    x: WIDTH / 2,
    y: 580,
    vx: 0,
    vy: 0,
    radius: 22,
    isThrown: false,
    hasScored: false,
    reset() {
        this.x = this.spawnX;
        this.y = this.spawnY;
        this.vx = 0;
        this.vy = 0;
        this.isThrown = false;
        this.hasScored = false;
    }
};

// Input Handling
let swiping = false;
let touchStartPos = { x: 0, y: 0 };
let currentTouchPos = { x: 0, y: 0 };

function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
        x: (clientX - rect.left) * (WIDTH / rect.width),
        y: (clientY - rect.top) * (HEIGHT / rect.height)
    };
}

function handleStart(e) {
    if (!ball.isThrown) {
        swiping = true;
        touchStartPos = getCanvasPos(e);
        currentTouchPos = { ...touchStartPos };
    }
}

function handleMove(e) {
    if (swiping) {
        currentTouchPos = getCanvasPos(e);
    }
}

function handleEnd(e) {
    if (swiping && !ball.isThrown) {
        swiping = false;
        const dx = currentTouchPos.x - touchStartPos.x;
        const dy = currentTouchPos.y - touchStartPos.y;

        if (dy < -20) { // Upward flick required
            ball.vx = Math.max(Math.min(dx * 0.12, 15), -15);
            ball.vy = Math.max(Math.min(dy * 0.14, -8), -22);
            ball.isThrown = true;
        }
    }
}

// Event Listeners
canvas.addEventListener('mousedown', handleStart);
canvas.addEventListener('mousemove', handleMove);
window.addEventListener('mouseup', handleEnd);

canvas.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(e); }, { passive: false });
canvas.addEventListener('touchmove', (e) => { e.preventDefault(); handleMove(e); }, { passive: false });
window.addEventListener('touchend', handleEnd);

// Physics & Update Loop
function update() {
    if (ball.isThrown) {
        ball.vy += GRAVITY;
        ball.x += ball.vx;
        ball.y += ball.vy;

        // Wall collisions
        if (ball.x - ball.radius < 0) {
            ball.x = ball.radius;
            ball.vx *= -BOUNCE_DAMPING;
        } else if (ball.x + ball.radius > WIDTH) {
            ball.x = WIDTH - ball.radius;
            ball.vx *= -BOUNCE_DAMPING;
        }

        // Rim Collisions
        [hoop.leftRim, hoop.rightRim].forEach(rimX => {
            const dist = Math.hypot(ball.x - rimX, ball.y - hoop.y);
            if (dist < ball.radius + hoop.rimRadius) {
                const overlap = (ball.radius + hoop.rimRadius) - dist;
                const nx = (ball.x - rimX) / (dist || 1);
                const ny = (ball.y - hoop.y) / (dist || 1);
                ball.x += nx * overlap;
                ball.y += ny * overlap;
                ball.vx = (ball.vx * 0.5) + (nx * 5);
                ball.vy = (ball.vy * -0.5) + (ny * 5);
            }
        });

        // Scoring Check
        if (!ball.hasScored && ball.vy > 0) {
            if (ball.x > hoop.leftRim + 10 && ball.x < hoop.rightRim - 10 && Math.abs(ball.y - hoop.y) < 15) {
                ball.hasScored = true;
                score++;
                if (score > highScore) highScore = score;
            }
        }

        // Reset off bottom
        if (ball.y - ball.radius > HEIGHT) {
            if (!ball.hasScored) score = 0; // Reset streak if missed
            ball.reset();
        }
    }
}

// Render Loop
function draw() {
    ctx.clearRect(0, 0, WIDTH, HEIGHT);

    // Court Floor
    ctx.fillStyle = '#1e293b';
    ctx.fillRect(0, 480, WIDTH, 220);
    ctx.strokeStyle = '#334155';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(0, 480);
    ctx.lineTo(WIDTH, 480);
    ctx.stroke();

    // Backboard Pole & Plate
    ctx.fillStyle = '#64748b';
    ctx.fillRect(hoop.x - 5, hoop.y - 70, 10, 70);
    ctx.fillStyle = '#e2e8f0';
    ctx.fillRect(hoop.x - 50, hoop.y - 65, 100, 50);
    ctx.strokeStyle = '#dc2626';
    ctx.lineWidth = 3;
    ctx.strokeRect(hoop.x - 50, hoop.y - 65, 100, 50);
    ctx.strokeRect(hoop.x - 20, hoop.y - 40, 40, 25);

    // Net
    ctx.strokeStyle = '#f1f5f9';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(hoop.leftRim, hoop.y);
    ctx.lineTo(hoop.x - 20, hoop.y + 35);
    ctx.lineTo(hoop.x + 20, hoop.y + 35);
    ctx.lineTo(hoop.rightRim, hoop.y);
    ctx.stroke();

    // Rim
    ctx.strokeStyle = '#dc2626';
    ctx.lineWidth = 6;
    ctx.beginPath();
    ctx.moveTo(hoop.leftRim, hoop.y);
    ctx.lineTo(hoop.rightRim, hoop.y);
    ctx.stroke();

    // Ball Shadow
    if (!ball.isThrown) {
        ctx.fillStyle = '#1e293b';
        ctx.beginPath();
        ctx.ellipse(ball.x, ball.y + 18, 20, 5, 0, 0, Math.PI * 2);
        ctx.fill();
    }

    // Trajectory Guide Line
    if (swiping && !ball.isThrown) {
        ctx.strokeStyle = '#fb923c';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(touchStartPos.x, touchStartPos.y);
        ctx.lineTo(currentTouchPos.x, currentTouchPos.y);
        ctx.stroke();
    }

    // Ball
    ctx.fillStyle = '#ea580c';
    ctx.beginPath();
    ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#9a3412';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Score Text
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 48px Arial';
    ctx.textAlign = 'center';
    ctx.fillText(score, WIDTH / 2, 60);

    ctx.fillStyle = '#94a3b8';
    ctx.font = 'bold 18px Arial';
    ctx.textAlign = 'right';
    ctx.fillText(`BEST: ${highScore}`, WIDTH - 20, 30);

    if (!ball.isThrown && score === 0) {
        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 18px Arial';
        ctx.textAlign = 'center';
        ctx.fillText('SWIPE UP TO SHOOT', WIDTH / 2, 530);
    }
}

function gameLoop() {
    update();
    draw();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
</body>
</html>
